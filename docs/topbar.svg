    <rect x="439" y="61" width="3" height="6"/><rect x="445" y="61" width="3" height="6"/><rect x="460" y="61" width="3" height="6"/><rect x="466" y="61" width="3" height="6"/></g>
  <rect x="442" y="43" width="3" height="6" fill="#000"/><rect x="463" y="43" width="3" height="6" fill="#000"/>
