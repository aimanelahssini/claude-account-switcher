  <rect x="520" y="27" width="96" height="50" rx="10" fill="#ffffff" fill-opacity="0.10"/>
  <text x="532" y="57" fill="#d97757" font-size="24" font-weight="bold">−</text>
  <text x="552" y="57" fill="#fff" font-size="21" font-weight="bold">53%</text>
  <rect x="536" y="65" width="66" height="6" rx="3" fill="#fff" fill-opacity="0.18"/>
  <rect x="536" y="65" width="35" height="6" rx="3" fill="#d97757"/>
